<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
      .badge { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.8; transform: scale(1.02); }
        100% { opacity: 0.3; transform: scale(0.98); }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      @keyframes flow {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      .animated-bg-circle { animation: pulse 6s ease-in-out infinite; transform-origin: center; }
      .animated-float { animation: float 4s ease-in-out infinite; }
      .data-stream { stroke-dasharray: 10, 15; animation: flow 3s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/>

  <!-- Dynamic Glowing Background Elements (Behind text & graphics) -->
  <circle cx="150" cy="100" r="180" fill="#38bdf8" opacity="0.15" filter="url(#glow)" class="animated-bg-circle"/>
  <circle cx="1050" cy="300" r="220" fill="#c084fc" opacity="0.15" filter="url(#glow)" class="animated-bg-circle" style="animation-delay: 2s;"/>

  <!-- Background Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Animated Data Streams (Decorative Line Flows) -->
  <path d="M 100 320 Q 300 280 500 340 T 900 300 T 1100 350" fill="none" stroke="url(#accent-grad)" stroke-width="3" opacity="0.4" class="data-stream"/>
  <path d="M 50 350 Q 350 310 650 370 T 1000 320" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3" class="data-stream" style="animation-duration: 4s;"/>

  <!-- Foreground Content Container -->
  <g transform="translate(80, 0)">
    <!-- Top Pill / Category Tag -->
    <g transform="translate(0, 75)">
      <rect width="280" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
      <text x="20" y="22" class="badge">📦 EDGE STORAGE &amp; MIGRATION</text>
    </g>

    <!-- Main Title (Foreground - Guaranteed Visible) -->
    <text x="0" y="165" class="title">Awesome Edge Storage &amp;</text>
    <text x="0" y="220" class="title" fill="url(#accent-grad)">Physical Data Migration 🚚</text>

    <!-- Subtitle -->
    <text x="0" y="270" class="subtitle">Petabyte-Scale Transport Appliances &amp; High-Speed Open-Source Data Movement</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 310)">
      <rect x="0" y="0" width="160" height="30" rx="8" fill="#334155" opacity="0.6"/>
      <text x="14" y="20" font-family="Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">☁️ AWS / Azure / GCP</text>

      <rect x="175" y="0" width="150" height="30" rx="8" fill="#334155" opacity="0.6"/>
      <text x="189" y="20" font-family="Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">⚡ Rclone &amp; Restic</text>

      <rect x="340" y="0" width="160" height="30" rx="8" fill="#334155" opacity="0.6"/>
      <text x="354" y="20" font-family="Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">🔒 Petabyte Transport</text>
    </g>
  </g>

  <!-- Side Illustration: Physical Storage Appliance (Foreground Right) -->
  <g transform="translate(920, 110)" class="animated-float">
    <!-- Outer Appliance Box -->
    <rect x="0" y="0" width="180" height="180" rx="20" fill="#1e293b" stroke="url(#accent-grad)" stroke-width="3" filter="url(#glow)"/>
    <!-- Drive Slots -->
    <rect x="20" y="25" width="140" height="24" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <circle cx="35" cy="37" r="4" fill="#10b981"/>
    <line x1="50" y1="37" x2="140" y2="37" stroke="#334155" stroke-width="3" stroke-dasharray="4,4"/>

    <rect x="20" y="60" width="140" height="24" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <circle cx="35" cy="72" r="4" fill="#10b981"/>
    <line x1="50" y1="72" x2="140" y2="72" stroke="#334155" stroke-width="3" stroke-dasharray="4,4"/>

    <rect x="20" y="95" width="140" height="24" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <circle cx="35" cy="107" r="4" fill="#38bdf8"/>
    <line x1="50" y1="107" x2="140" y2="107" stroke="#334155" stroke-width="3" stroke-dasharray="4,4"/>

    <rect x="20" y="130" width="140" height="24" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <circle cx="35" cy="142" r="4" fill="#c084fc"/>
    <line x1="50" y1="142" x2="140" y2="142" stroke="#334155" stroke-width="3" stroke-dasharray="4,4"/>
  </g>
</svg>
